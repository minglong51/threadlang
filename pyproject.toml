[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "threadlang"
version = "0.6.0"
description = "A small DSL for deterministic, traceable LLM and agent workflows"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ThreadLang Contributors" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40,<1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
threadlang = "threadlang.cli:main"
threadlang-serve = "threadlang.server:main"
